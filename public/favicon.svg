<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    LLC 谐振变换器设计工具 —— favicon
    造型：谐振尖峰脉冲（本站首页主图标 Activity 的加粗版），与页头 / 页脚 BrandMark 同一套 path。
    语义：LC 谐振腔的电压 / 电流波形。
    配色遵循站群统一规范：深底 #0a0a0a / 主形 teal #14b8a6 / amber #f59e0b 仅标关键点
    （amber 落在尖峰顶，代表谐振峰处的工作点）。
    16px 可读性：单条折线带一个明显尖峰，与 ipfc 的双波、AHB 的闪电均可区分。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <path d="M3 16 H10 L13 6 L17 26 L20.5 16 H29"
        fill="none" stroke="#14b8a6" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="13" cy="6" r="2.3" fill="#f59e0b"/>
</svg>
