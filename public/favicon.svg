<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    LLC 谐振变换器设计工具 —— favicon

    取向：取 LLC 设计者最核心的那张图, 电压增益曲线 M(fn) 作为识别符号。
      左段增益随频率上升 -> 谐振峰 M_max -> 越过谐振点后快速下跌 -> 高频段趋于平坦
      橙色实心点标出谐振峰处的工作点。
    配色取自本站设计系统: teal #14b8a6 主色 / amber #f59e0b 强调 / #0a0a0a 深底。
    形态为非振荡、非对称结构, 与姊妹站 widget(power-knowledge.tech) 的对称正弦波
    在 16px 标签页尺寸下即可区分 —— 这是本次替换的首要目的。

    注: 本文件须由 index.html 以 /favicon.svg 引用; 历史上该引用曾误指 /vite.svg
    (该文件在仓库中从不存在, 线上恒 404), 故图标长期未生效。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <path d="M5 18 C 7 15, 9 6, 11 6 C 13 6, 14 13, 15.5 17 C 18 20.5, 22 20, 27 20"
        fill="none" stroke="#14b8a6" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="11" cy="6.2" r="2.5" fill="#f59e0b"/>
</svg>
